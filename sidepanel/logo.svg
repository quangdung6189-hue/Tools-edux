<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Outer Ring Gradient: Deep Royal Blue to Sky to Electric Cyan -->
    <linearGradient id="ringGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="90%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Ring 3D Bevel Highlight -->
    <linearGradient id="ringHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Letter D Body Gradient -->
    <linearGradient id="dBodyGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="45%" stop-color="#1d4ed8" />
      <stop offset="85%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- D Outer Curve Highlight -->
    <linearGradient id="dCurveGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Orange Gradient for D inner ribbon & signal waves -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="80%" stop-color="#ff6530" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Arrow Upper Facet (Bright Cyan Glow) -->
    <linearGradient id="arrowLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>

    <!-- Arrow Lower Bevel Facet (Deeper Azure) -->
    <linearGradient id="arrowShade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <!-- Golden Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="dung-marketing-logo">
    <!-- 1. Outer Swirling Ring (sweeps from top-left, around bottom, to mid-right) -->
    <path d="M 104,26 A 74,74 0 1, 0 152,142" 
          fill="none" 
          stroke="url(#ringGrad)" 
          stroke-width="13" 
          stroke-linecap="round" />
    <!-- Outer ring inner 3D specular sheen -->
    <path d="M 100,28 A 71,71 0 1, 0 148,138" 
          fill="none" 
          stroke="url(#ringHighlight)" 
          stroke-width="2.5" 
          opacity="0.6" />

    <!-- 2. Letter "D" Shape -->
    <!-- D Solid Base & Back Structure with transparent counter -->
    <path d="M 58,58 L 95,58 C 122,58 138,76 138,102 C 138,128 122,146 95,146 L 58,146 Z M 74,75 L 94,75 C 112,75 120,86 120,102 C 120,118 112,129 94,129 L 74,129 Z" 
          fill-rule="evenodd"
          fill="url(#dBodyGrad)" />

    <!-- D Upper Inner Orange Ribbon (The distinctive orange accent from Dung Marketing) -->
    <path d="M 86,75 C 108,75 119,83 121,98 C 117,89 108,82 92,82 L 80,82 Z" 
          fill="url(#orangeGrad)" />
    <path d="M 88,58 C 114,58 126,67 129,80 C 125,71 114,64 96,64 L 78,64 Z" 
          fill="url(#orangeGrad)" opacity="0.9" />

    <!-- 3. Rising Growth / Trend Arrow (Zigzag Chart cutting through the D) -->
    <!-- Lower shadow facet -->
    <path d="M 28,142 L 56,108 L 78,122 L 140,56 L 140,68 L 78,134 L 56,120 L 28,154 Z" 
          fill="url(#arrowShade)" />
    <!-- Upper highlight facet -->
    <path d="M 28,142 L 56,108 L 78,122 L 144,52 L 138,46 L 78,110 L 56,96 L 28,130 Z" 
          fill="url(#arrowLight)" />
    <!-- Main shaft body -->
    <polyline points="30,136 56,102 78,116 142,52" 
              fill="none" 
              stroke="url(#arrowLight)" 
              stroke-width="12" 
              stroke-linecap="round" 
              stroke-linejoin="round" />

    <!-- Arrow Head - 3D Polygon -->
    <!-- Top-left light face -->
    <polygon points="166,28 132,36 145,50" 
             fill="url(#arrowLight)" />
    <!-- Bottom-right shaded bevel face -->
    <polygon points="166,28 145,50 152,64" 
             fill="url(#arrowShade)" />
    <!-- Specular highlight line along arrow spine -->
    <line x1="30" y1="136" x2="166" y2="28" 
          stroke="#e0f2fe" 
          stroke-width="1.8" 
          opacity="0.75" />

    <!-- 4. Four-Pointed Star / Sparkle (Creativity) at the top -->
    <g transform="translate(116, 32)">
      <path d="M 0,-18 Q 0,0 -18,0 Q 0,0 0,18 Q 0,0 18,0 Q 0,0 0,-18 Z" 
            fill="url(#starGrad)" />
      <!-- Star bright center core -->
      <circle cx="0" cy="0" r="3" fill="#fff" opacity="0.9" />
      <circle cx="0" cy="0" r="6" fill="#fde047" opacity="0.4" />
    </g>

    <!-- 5. Signal / Broadcast Waves (Strategy & Communication) -->
    <g stroke="url(#orangeGrad)" stroke-linecap="round" fill="none">
      <!-- Inner arc -->
      <path d="M 148,82 A 12,12 0 0, 1 156,98" stroke-width="4.5" />
      <!-- Outer arc -->
      <path d="M 154,72 A 22,22 0 0, 1 166,102" stroke-width="4.8" />
    </g>
  </g>
</svg>
